[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "archdocs"
version = "0.1.0"
description = "Architecture-as-code documentation generator (wraps mingrammer/diagrams) for AWS, GitLab, Flux, ArgoCD, ESO, Prometheus, Grafana, Loki, Kubernetes, and Helm."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Mike Roach" }]
dependencies = [
    "diagrams>=0.24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
archdocs = "archdocs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
